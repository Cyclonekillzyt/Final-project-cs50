{% extends "base.html" %}

{% block content %}
<div class="form-page">
  <form
    class="modal-form"
    method="POST"
    action="{{ url_for('edit_project', project_id=project['id']) if project else url_for('new_project') }}"
  >
    <h3 class="modal-form__title">{{ 'Edit Project' if project else 'New Project' }}</h3>

    {% if error %}
      <p class="form-error">{{ error }}</p>
    {% endif %}

    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ project['title'] if project else '' }}" required autofocus />

    <p class="modal-form__hint">
      This window sets which days - and which hours of each day - tasks in this project can be scheduled into.
    </p>

    <div class="form-row">
      <div>
        <label for="start_date">Start Date</label>
        <input
          type="date"
          id="start_date"
          name="start_date"
          value="{{ project['start_date'] if project else today }}"
          onchange="document.getElementById('end_date').min = this.value"
          required
        />
      </div>
      <div>
        <label for="start_time">Start Time</label>
        <input type="time" id="start_time" name="start_time" value="{{ project['start_time'] if project else '09:00' }}" required />
      </div>
    </div>

    <div class="form-row">
      <div>
        <label for="end_date">End Date</label>
        <input
          type="date"
          id="end_date"
          name="end_date"
          value="{{ project['end_date'] if project else today }}"
          min="{{ project['start_date'] if project else today }}"
          required
        />
      </div>
      <div>
        <label for="end_time">End Time</label>
        <input type="time" id="end_time" name="end_time" value="{{ project['end_time'] if project else '17:00' }}" required />
      </div>
    </div>

    <div class="modal-form__actions">
      <a class="cancel" href="{{ url_for('index', project_id=project['id']) if project else url_for('index') }}">Cancel</a>
      <button type="submit" class="submit">{{ 'Save Changes' if project else 'Create Project' }}</button>
    </div>
  </form>
</div>
{% endblock %}
